name: Publish demo

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: screenshot-redactor-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Test the built site with the runner's Chrome
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    outputs:
      site_url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
      - name: Check the public homepage and OCR model
        env:
          SITE_URL: ${{ steps.pages.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$base/" -o homepage.html
          grep -Fq 'Try a sample' homepage.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$base/vendor/lang/eng.traineddata.gz" -o model.gz
          gzip -t model.gz

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify OCR, manual redaction and PNG export on the public site
        env:
          REDACTOR_TEST_URL: ${{ needs.deploy.outputs.site_url }}
        run: |
          test -n "$REDACTOR_TEST_URL"
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          node --test tests/browser.e2e.mjs
